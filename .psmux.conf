# ============================================================
# PSMUX/ TMUX VERSION
# ============================================================
# psmux --version
# tmux 3.3.6


# ============================================================
# TERMINAL
# ============================================================
# True color support
set -g default-terminal "tmux-256color"

# Default shell (comment/uncomment to switch — use gcc in neovim)
# set -g default-shell pwsh
set -g default-shell "C:/Users/James Michael/scoop/shims/nu.exe"

# ============================================================
# CORE / RESPONSIVENESS
# ============================================================
set -s escape-time 0
set -g focus-events on
set -g mouse on

# ============================================================
# WINDOW TITLE
# ============================================================
# Fix neovim showing as "node" in window titles
set-option -g automatic-rename on

# ============================================================
# PREFIX
# ============================================================
set -g prefix C-a
unbind C-b
bind-key -T prefix C-a send-prefix

# ============================================================
# PANE SPLITTING
# ============================================================
# Open new panes in the same directory as the current pane
bind-key -T prefix | split-window -h -c "#{pane_current_path}"
bind-key -T prefix - split-window -v -c "#{pane_current_path}"

# ============================================================
# PANE NAVIGATION (vim-style) - no prefix (Ctrl+hjkl)
# ============================================================
bind-key -T root C-h select-pane -L
bind-key -T root C-j select-pane -D
bind-key -T root C-k select-pane -U
bind-key -T root C-l select-pane -R

# ============================================================
# PANE RESIZING (vim-style) - prefix + Shift+HJKL (repeatable)
# ============================================================
bind-key -T prefix -r H resize-pane -L 5
bind-key -T prefix -r J resize-pane -D 5
bind-key -T prefix -r K resize-pane -U 5
bind-key -T prefix -r L resize-pane -R 5

# Lowercase (no Shift) — what you want
bind-key -T prefix -r h resize-pane -L 5
bind-key -T prefix -r j resize-pane -D 5
bind-key -T prefix -r k resize-pane -U 5
bind-key -T prefix -r l resize-pane -R 5

# ============================================================
# VI MODE / COPY MODE
# ============================================================
set-window-option -g mode-keys vi
# Windows clipboard integration (clip.exe)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"

# ============================================================
# CONFIG RELOAD
# ============================================================
bind-key -T prefix r source-file ~/.psmux.conf \; display-message "Config reloaded!"

# ============================================================
# QUALITY OF LIFE
# ============================================================
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
setw -g aggressive-resize on
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on
set -g display-panes-time 3000

# Last window (Tab to avoid conflict with resize l)
bind-key -T prefix Tab last-window

# Refresh pane redraw (switch window and back)
bind-key -T prefix u run-shell "psmux next-window && sleep 0.05 && psmux previous-window"

# ============================================================
# FLOATING TERMINAL
# ============================================================
# Ctrl+t: toggle an 80% floating terminal in the current pane's directory
bind-key -T root C-t display-popup -E -K -w 80% -h 80% -d '#{pane_current_path}' "pwsh"

# ============================================================
# STATUS BAR / THEME (Catppuccin Mocha)
# ============================================================
set -g status-position top
# set -g status-justify absolute-centre
set -g status-justify left
set -g status-style bg=default,fg=#cdd6f4
set-option -g status-style bg=default

# Colors (Catppuccin Mocha)
# Green: #a6e3a1, Blue: #89b4fa, Orange: #fab387, Pink: #f5c2e7, Gray: #313244, Surface: #45475a

# Left: [Icon] [Session] - Rounded start, sharp middle, rounded end
set -g status-left-length 60
set -g status-left "#{?client_prefix,#[fg=#f38ba8,bg=default]#[bg=#f38ba8,fg=#1e1e2e,bold]󰊠 #[fg=#f38ba8,bg=#313244]#[bg=#313244,fg=#cdd6f4] #S#[fg=#313244,bg=default],#[fg=#a6e3a1,bg=default]#[bg=#a6e3a1,fg=#1e1e2e] #[fg=#a6e3a1,bg=#313244]#[bg=#313244,fg=#cdd6f4] #S#[fg=#313244,bg=default]} "

# Right: [Folder | Path] - Rounded start, rounded end
set -g status-right-length 60
# set -g status-right "#[fg=#f5c2e7,bg=default]#[bg=#f5c2e7,fg=#1e1e2e]󰉋 #[fg=#1e1e2e,bg=#313244]#[bg=#313244,fg=#cdd6f4] #{b:pane_current_path}#[fg=#313244,bg=default]"
set -g status-right "#[fg=#f5c2e7,bg=default]#[bg=#f5c2e7,fg=#1e1e2e]󰉋 #[fg=#1e1e2e,bg=#313244]#[bg=#313244,fg=#cdd6f4] #{b:pane_current_path}#[fg=#313244,bg=default] #[fg=#89b4fa,bg=default]#[bg=#89b4fa,fg=#1e1e2e]󰀄 #[fg=#1e1e2e,bg=#313244]#[bg=#313244,fg=#cdd6f4] James Michael#[fg=#313244,bg=default] #[fg=#a7e3a1,bg=default]#[bg=#a6e3a1,fg=#1e1e2e]󰥔 #[fg=#1e1e2e,bg=#313244]#[bg=#313244,fg=#cdd6f4] %H:%M#[fg=#313244,bg=default]"


# Window Status (Split Block: Name | Index)
set -g window-status-separator " "

# Inactive: [ name ] [ index ]
set -g window-status-format "#[fg=#313244,bg=default]#[bg=#313244,fg=#cdd6f4]#W #[fg=#1e1e2e,bg=#45475a]#[bg=#45475a,fg=#cdd6f4] #I#[fg=#45475a,bg=default]"

# Active: [ name ] [ index ] (Blue theme)
set -g window-status-current-format "#[fg=#313244,bg=default]#[bg=#313244,fg=#cdd6f4]#W #[fg=#1e1e2e,bg=#89b4fa]#[bg=#89b4fa,fg=#1e1e2e,bold] #I#[fg=#89b4fa,bg=default]"

# Activity/Bell indicators
set -g window-status-activity-style "fg=#f9e2af,bg=#313244"
set -g window-status-bell-style "fg=#f38ba8,bg=#313244"

# --- PANE BORDERS ---
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#cba6f7

# Pane number indicator
set -g display-panes-colour #45475a
set -g display-panes-active-colour #cba6f7

# --- COPY MODE STYLING ---
# Selection color (Catppuccin Mauve)
set -g mode-style "fg=#1e1e2e,bg=#cba6f7,bold"

# --- MESSAGE STYLING ---
set -g message-style bg=#cba6f7,fg=#1e1e2e,bold

# ============================================================
# PLUGIN MANAGER (PPM)
# ============================================================
# Plugins managed by PPM (GitHub format: owner/repo)
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-continuum'

# Initialize PPM (keep at the very bottom)
run 'C:/Users/JamesMichael/.psmux/plugins/ppm/ppm.ps1'
